<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d3557">
<title>Central de Follow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231d3557'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%233ABFA0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>

  :root {
    --bg: #F6F5F1;
    --card: #FFFFFF;
    --ink: #16283F;
    --muted: #5E6C7F;
    --line: rgba(22, 40, 63, 0.16);
    --rule: #16283F;
    --teal: #2FA98C;
    --teal-ink: #17705B;
    --teal-soft: rgba(47, 169, 140, 0.10);
    --navy: #1d3557;
    --navy-ink: #F7F7F7;
    --done: #97A5B4;
    --warn: #96660E;
    --err: #B3413C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0A0B0D;
      --card: #131519;
      --ink: #E8ECF2;
      --muted: #7E92A9;
      --line: rgba(232, 236, 242, 0.11);
      --rule: #E8ECF2;
      --teal: #3ABFA0;
      --teal-ink: #6FD9BF;
      --teal-soft: rgba(58, 191, 160, 0.10);
      --navy: #0A0B0D;
      --navy-ink: #E8ECF2;
      --done: #56687D;
      --warn: #D3A249;
      --err: #E28B84;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 13.5px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 20px 72px; }
  header.top {
    background: var(--bg);
    color: var(--ink);
    position: sticky; top: 0; z-index: 10;
    border-top: 4px solid var(--teal);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .top-in {
    max-width: 680px; margin: 0 auto;
    padding: 12px 20px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  .brand {
    font-weight: 800; font-size: 15px; letter-spacing: -0.02em; white-space: nowrap;
    background: none; border: 0; color: inherit; font-family: inherit; cursor: pointer; padding: 0;
  }
  .brand span.mark { color: var(--teal-ink); }
  .brand .suffix {
    font-weight: 700; font-size: 9.5px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--muted); margin-left: 4px;
  }
  @media (max-width: 480px) { .brand .suffix { display: none; } }
  .who-chip {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    background: none; border: 1px solid var(--line); border-radius: 0;
    padding: 5px 9px; cursor: pointer; color: var(--ink); font-family: inherit; border-radius: 8px;
  }
  .eyebrow {
    font-size: 9.5px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.26em; color: var(--teal-ink); margin: 22px 0 6px;
  }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.025em; margin: 0 0 2px; text-wrap: balance; }
  h2 { font-size: 14px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
  .sub { color: var(--muted); font-size: 11.5px; margin: 0 0 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px 6px;
    margin-bottom: 14px;
  }
  .cel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 2px; flex-wrap: wrap; }
  .cel-region {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--muted);
  }
  .conta-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-top: 1px solid var(--line);
    cursor: pointer;
  }
  .conta-row:first-of-type { border-top: 0; }
  .conta-main { flex: 1; min-width: 0; }
  .conta-user { font-weight: 700; font-size: 13.5px; }
  .conta-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .conta-atual { font-size: 11px; color: var(--teal-ink); font-weight: 600; margin-top: 1px; }
  .pbar { height: 2px; background: var(--line); border-radius: 0; margin-top: 6px; overflow: hidden; }
  .pbar > div { height: 100%; background: var(--teal); border-radius: 0; }
  .pct { font-size: 12.5px; font-weight: 800; color: var(--ink); white-space: nowrap; }
  .arrow { color: var(--muted); font-weight: 400; }
  .back {
    background: none; border: 0; color: var(--teal-ink); font-family: inherit;
    font-weight: 700; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 0; cursor: pointer; margin-top: 16px;
  }
  .statbar { display: flex; gap: 8px; margin: 12px 0 14px; }
  .stat {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px 12px 10px;
  }
  .stat .n { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .stat .l {
    font-size: 8.5px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.2em; font-weight: 700; margin-top: 1px;
  }
  .foco {
    background: none; border: 0; border-bottom: 1px solid var(--line);
    border-radius: 0; padding: 2px 0 10px; font-size: 11.5px;
    color: var(--muted); margin: 0 0 12px;
  }
  .foco b {
    display: block; color: var(--ink); font-size: 9px; font-weight: 800;
    letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 2px;
  }
  .atual-banner {
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line);
    border-top: 2px solid var(--teal);
    border-radius: 12px; padding: 9px 14px 6px; margin: 0 0 12px;
  }
  .atual-banner .tag {
    font-size: 9px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.24em; color: var(--teal-ink); display: block; margin-bottom: 2px;
  }
  .atual-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 0; border-top: 1px solid var(--line);
  }
  .atual-item:first-of-type { border-top: 0; }
  .atual-item .h { font-weight: 800; font-size: 13px; flex: 1; min-width: 0; word-break: break-all; }
  .atual-banner .btn { padding: 6px 10px; }
  .fac-head {
    position: relative;
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink);
    padding: 10px 24px 3px 0; border-top: 1px solid var(--rule); margin-top: 6px;
    cursor: pointer; user-select: none;
  }
  .fac-head:first-child { border-top: 0; margin-top: 0; }
  .fac-head small {
    display: block; font-weight: 600; letter-spacing: 0.02em;
    text-transform: none; color: var(--muted); font-size: 10.5px;
  }
  .fac-head .caret {
    position: absolute; right: 0; top: 11px;
    color: var(--muted); font-size: 11px;
    transition: transform 0.15s; display: inline-block;
  }
  .fac-head.fechado .caret { transform: rotate(-90deg); }
  .op-head {
    display: flex; align-items: baseline; gap: 10px;
    cursor: pointer; user-select: none;
    margin: 22px 0 8px; padding-bottom: 4px;
    border-bottom: 2px solid var(--rule);
  }
  .op-head .nome {
    font-size: 11.5px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.2em; color: var(--ink);
  }
  .op-head small { color: var(--muted); font-weight: 600; font-size: 10.5px; }
  .op-head .caret {
    margin-left: auto; color: var(--muted); font-size: 11px;
    transition: transform 0.15s; display: inline-block;
  }
  .op-head.fechado .caret { transform: rotate(-90deg); }
  .dot {
    width: 8px; height: 8px; border-radius: 3px;
    display: inline-block; margin-right: 7px; flex-shrink: 0;
  }
  .dot.ativa { background: var(--teal); }
  .dot.pausada { background: var(--warn); }
  .dot.ban { background: var(--err); }
  .st-sel {
    font-family: inherit; font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 4px 5px; border: 1px solid var(--line); border-radius: 7px;
    background: none; color: var(--muted);
    margin-left: auto; flex-shrink: 0;
  }
  .st-sel.ativa { color: var(--teal-ink); border-color: var(--teal-ink); }
  .st-sel.pausada { color: var(--warn); border-color: var(--warn); }
  .st-sel.ban { color: var(--err); border-color: var(--err); }
  .st-sel option { background: var(--card); text-transform: none; letter-spacing: 0; }
  .st-sel option.ativa { color: var(--teal-ink); }
  .st-sel option.pausada { color: var(--warn); }
  .st-sel option.ban { color: var(--err); }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(6, 11, 19, 0.62);
    z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    background: var(--card); border: 1px solid var(--line);
    border-top: 3px solid var(--teal); border-radius: 14px;
    width: 100%; max-width: 430px; max-height: 85vh; overflow: auto; padding: 18px 20px;
  }
  .modal h2 { font-size: 16px; margin-bottom: 1px; }
  .modal .mm {
    font-size: 9px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 14px;
  }
  .dado { margin-bottom: 9px; }
  .dado label {
    display: block; font-size: 8.5px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.18em; color: var(--muted); margin-bottom: 3px;
  }
  .dado .linha { display: flex; gap: 6px; }
  .dado input {
    flex: 1; min-width: 0;
    padding: 8px 9px; border: 1px solid var(--line); border-radius: 9px;
    font-family: inherit; font-size: 13px; background: var(--bg); color: var(--ink);
  }
  .dado input:focus { outline: none; border-color: var(--teal-ink); }
  .modal .rodape { display: flex; gap: 8px; margin-top: 14px; }
  .conta-row.pausada .conta-user, .conta-row.ban .conta-user { opacity: 0.55; }
  .fac-badge {
    display: inline-block; font-size: 8.5px; font-weight: 800; letter-spacing: 0.16em;
    border: 0; border-radius: 0; padding: 0;
    margin-left: 8px; color: var(--muted); vertical-align: 1px; background: none;
  }
  .fac-badge.part { color: var(--teal-ink); border: 0; background: none; }
  .tools { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .search, .campo {
    flex: 1; min-width: 160px;
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px;
    font-family: inherit; font-size: 13px; background: var(--card); color: var(--ink);
  }
  .search:focus, .campo:focus { outline: none; border-color: var(--teal-ink); }
  .idx, .sel {
    width: 100%;
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px;
    font-family: inherit; font-size: 12.5px; background: var(--card); color: var(--ink);
    margin-bottom: 8px;
  }
  .sel { width: auto; margin-bottom: 0; padding: 5px 7px; font-size: 11px; }
  .btn {
    border: 1px solid var(--ink); background: none; color: var(--ink);
    font-family: inherit; font-size: 10px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 9px 13px; border-radius: 9px; cursor: pointer;
  }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  .chips { display: flex; gap: 0; flex-wrap: wrap; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .chip {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 7px 10px; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
    background: none; color: var(--muted);
    cursor: pointer; font-family: inherit; margin-bottom: -1px;
  }
  .chip.on { background: none; color: var(--ink); border-bottom-color: var(--teal); }
  .perfil {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 7px 0; border-top: 1px solid var(--line);
  }
  .perfil input[type="checkbox"] {
    width: 18px; height: 18px; margin-top: 2px;
    accent-color: var(--teal); cursor: pointer; flex-shrink: 0;
  }
  .perfil .info { flex: 1; min-width: 0; }
  .perfil a { color: var(--ink); font-weight: 700; text-decoration: none; font-size: 13.5px; word-break: break-all; }
  .perfil a:hover { color: var(--teal-ink); }
  .perfil .meta { font-size: 10.5px; color: var(--muted); }
  .perfil .meta .warn { color: var(--warn); font-weight: 700; }
  .perfil.done a { color: var(--done); text-decoration: line-through; font-weight: 500; }
  .perfil.done .meta { color: var(--done); }
  .perfil.desc { opacity: 0.5; }
  .perfil.desc a { color: var(--done); text-decoration: line-through; font-weight: 500; }
  .perfil.atual {
    background: var(--teal-soft);
    border-top: 0; border-left: 0;
    border-radius: 8px;
    padding: 7px 8px;
    margin: 2px -8px;
  }
  .pill {
    display: inline-block; font-size: 8px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.16em; color: var(--teal-ink);
    background: none; border: 1px solid var(--teal-ink);
    padding: 1px 5px; border-radius: 5px; margin-left: 6px; vertical-align: 2px;
  }
  .pill.off { color: var(--muted); border-color: var(--line); }
  .acts { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; flex-shrink: 0; }
  .minibtn {
    border: 1px solid var(--line); background: none; color: var(--muted);
    font-family: inherit; font-size: 9px; font-weight: 800;
    padding: 6px 8px; border-radius: 7px; cursor: pointer; flex-shrink: 0;
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .minibtn.go { color: var(--teal-ink); border-color: var(--teal-ink); }
  .minibtn.fim { background: var(--teal); border-color: var(--teal); color: #06251C; }
  .bk-area {
    width: 100%; min-height: 64px; margin-top: 6px;
    border: 1px solid var(--line); border-radius: 10px; padding: 9px;
    font-family: ui-monospace, Consolas, monospace; font-size: 11px;
    background: var(--bg); color: var(--ink);
    word-break: break-all;
  }
  .topo {
    position: fixed; right: 16px; bottom: 18px; z-index: 40;
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--ink); color: var(--bg);
    border: 0; font-size: 16px; font-weight: 800; cursor: pointer;
    box-shadow: none;
  }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    padding: 9px 16px; border-radius: 10px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 50;
    max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  .note { font-size: 11px; color: var(--muted); margin-top: 14px; }
  .erro { color: var(--err); font-size: 12px; font-weight: 700; margin-top: 10px; }
  .login-box { max-width: 360px; margin: 44px auto 0; border-top: 2px solid var(--rule); padding-top: 4px; }
  .login-box .campo { width: 100%; min-width: 0; margin-bottom: 8px; }
  .g-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .g-row label {
    font-size: 8.5px; color: var(--muted); font-weight: 800;
    letter-spacing: 0.16em; text-transform: uppercase;
  }
  a { color: var(--teal-ink); }

  /* ===== acabamento premium (elevacao em camadas, hover, foco) ===== */
  :root {
    --card2: #FFFFFF;
    --elev: 0 1px 2px rgba(22, 40, 63, 0.06);
    --elev2: 0 12px 40px rgba(22, 40, 63, 0.16);
    --hover: rgba(22, 40, 63, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card2: #1A1D23;
      --elev: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      --elev2: 0 24px 64px rgba(0, 0, 0, 0.55);
      --hover: rgba(255, 255, 255, 0.035);
    }
  }
  .card, .stat, .atual-banner { box-shadow: var(--elev); }
  .modal { background: var(--card2); box-shadow: var(--elev2); }
  .btn, .minibtn, .chip, .who-chip, .conta-row, .st-sel, .search, .campo, .idx, .sel, .fac-head, .op-head, .perfil a, .topo {
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  }
  .conta-row:hover { background: var(--hover); }
  .conta-row { margin: 0 -16px; padding-left: 16px; padding-right: 16px; border-radius: 8px; }
  .card .conta-row { border-radius: 0; }
  .card .conta-row:first-of-type { border-top: 0; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: #06251C; }
  .btn.primary:hover { filter: brightness(1.08); background: var(--teal); }
  .minibtn:hover { border-color: var(--muted); color: var(--ink); }
  .minibtn.go:hover { border-color: var(--teal-ink); color: var(--teal-ink); background: var(--teal-soft); }
  .minibtn.fim:hover { filter: brightness(1.08); }
  .chip:hover { color: var(--ink); }
  .who-chip:hover { border-color: var(--muted); }
  .search:focus, .campo:focus, .idx:focus, .sel:focus, .dado input:focus {
    outline: none; border-color: var(--teal);
    box-shadow: 0 0 0 3px var(--teal-soft);
  }
  .pbar { height: 3px; border-radius: 999px; }
  .pbar > div { border-radius: 999px; }
  .toast { box-shadow: var(--elev2); }
  .topo { box-shadow: var(--elev2); }
  .fac-head:hover .caret, .op-head:hover .caret { color: var(--ink); }
  .perfil.atual { box-shadow: inset 2px 0 0 var(--teal); }

  /* checkbox arredondado customizado (mesmo input, so visual) */
  .perfil input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 19px; height: 19px; margin-top: 2px;
    border: 1.5px solid var(--muted); border-radius: 6px;
    background: #FFFFFF; cursor: pointer; flex-shrink: 0;
    display: inline-grid; place-content: center;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .perfil input[type="checkbox"]:hover { border-color: var(--teal); }
  .perfil input[type="checkbox"]:checked { background: var(--teal); border-color: var(--teal); }
  .perfil input[type="checkbox"]:checked::after {
    content: ""; width: 11px; height: 11px; background: #06251C;
    clip-path: polygon(14% 44%, 0% 65%, 40% 100%, 100% 16%, 80% 0%, 38% 68%);
  }
  .perfil input[type="checkbox"]:disabled { opacity: 0.35; cursor: default; }

  .chk-vazio { width: 19px; flex-shrink: 0; }
</style>
</head>

<div class="toast" id="toast"></div>

// preferências locais de interface (não são dados de operação)
function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v === null ? fb : JSON.parse(v); } catch (e) { return fb; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function grpFechados(contaId) { const v = lsGet('cf_g_' + contaId, []); return Array.isArray(v) ? v : []; }
function toggleGrp(contaId, f) {
  const g = grpFechados(contaId);
  const i = g.indexOf(f);
  if (i >= 0) g.splice(i, 1); else g.push(f);
  lsSet('cf_g_' + contaId, g);
}
function abreGrp(contaId, f) {
  const g = grpFechados(contaId);
  const i = g.indexOf(f);
  if (i >= 0) { g.splice(i, 1); lsSet('cf_g_' + contaId, g); return true; }
  return false;
}

function hojeStr(ts) { return new Date(ts).toLocaleDateString('pt-BR'); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- progresso (banco) ----------
function estadoDe(contaId, h) { const p = PROG[contaId]; return p && p[h] ? p[h].estado : null; }
function marcados(contaId, estado) {
  const p = PROG[contaId] || {};
  return Object.keys(p).filter(h => p[h].estado === estado);
}
function atuais(contaId) { return marcados(contaId, 'seguindo'); }

async function setProg(contaId, handle, estado) {
  const p = PROG[contaId] || (PROG[contaId] = {});
  const antes = p[handle];
  if (estado) p[handle] = { estado, ts: Date.now() }; else delete p[handle];
  let res;
  if (estado) res = await cli.from('progresso').upsert({ conta: contaId, handle, estado, por: EU.email, ts: new Date().toISOString() });
  else res = await cli.from('progresso').delete().match({ conta: contaId, handle });
  if (res.error) {
    if (antes) p[handle] = antes; else delete p[handle];
    toast('Falha ao salvar. Confira a internet e tente de novo.');
    route();
  }
}

// ---------- dados derivados ----------
function contasDoCel(celId) { return CONTAS.filter(c => c.celular === celId).sort((a, b) => a.ordem - b.ordem); }
function celDe(conta) { return CELULARES.find(x => x.id === conta.celular); }
function celsDe(email) { return CELULARES.filter(c => c.operador_email === email).sort((a, b) => a.ordem - b.ordem); }
const _grupos = {};
function gruposRegiao(slug) {
  if (_grupos[slug]) return _grupos[slug];
  if (!PERFIS[slug]) return [];
  const map = new Map();
  for (const p of PERFIS[slug].perfis) {
    const k = p.f || 'Sem faculdade';
    if (!map.has(k)) map.set(k, { f: k, pr: p.pr ? 1 : 0, perfis: [] });
    map.get(k).perfis.push(p);
  }
  const arr = Array.from(map.values()).sort((a, b) => (b.pr - a.pr) || (b.perfis.length - a.perfis.length));
  _grupos[slug] = arr;
  return arr;
}
function sliceDe(conta) {
  const cel = celDe(conta);
  const irmas = contasDoCel(cel.id);
  const idx = irmas.findIndex(c => c.id === conta.id);
  const grupos = gruposRegiao(cel.regiao);
  const cargas = irmas.map(() => 0);
  const minhas = [];
  for (const g of grupos) {
    let alvo = 0;
    for (let i = 1; i < cargas.length; i++) if (cargas[i] < cargas[alvo]) alvo = i;
    cargas[alvo] += g.perfis.length;
    if (alvo === idx) minhas.push(g);
  }
  const perfis = [];
  for (const g of minhas) for (const p of g.perfis) perfis.push(p);
  return { idx, total: irmas.length, perfis, grupos: minhas };
}
function resumoConta(contaId) {
  const conta = CONTAS.find(c => c.id === contaId);
  const sl = sliceDe(conta);
  const p = PROG[contaId] || {};
  const nDesc = sl.perfis.filter(x => p[x.h] && p[x.h].estado === 'descartado').length;
  const feitos = sl.perfis.filter(x => p[x.h] && p[x.h].estado === 'concluido').length;
  const total = sl.perfis.length - nDesc;
  const nAt = sl.perfis.filter(x => p[x.h] && p[x.h].estado === 'seguindo').length;
  const pct = total ? Math.round(100 * feitos / total) : 0;
  return { sl, nDesc, feitos, total, nAt, pct };
}

// ---------- carga e tempo real ----------
async function carregaTudo() {
  const [ops, cels, cts, prg] = await Promise.all([
    cli.from('perfis_op').select('*'),
    cli.from('celulares').select('*').order('ordem'),
    cli.from('contas').select('*').order('ordem'),
    cli.from('progresso').select('*'),
  ]);
  if (ops.error || cels.error || cts.error || prg.error) {
    app.innerHTML = '<div class="card" style="margin-top:32px;">N&atilde;o consegui carregar os dados. Recarregue a p&aacute;gina.</div>';
    return false;
  }
  OPERADORES = ops.data;
  CELULARES = cels.data;
  CONTAS = cts.data;
  PROG = {};
  for (const r of prg.data) {
    if (!PROG[r.conta]) PROG[r.conta] = {};
    PROG[r.conta][r.handle] = { estado: r.estado, ts: Date.parse(r.ts) || Date.now() };
  }
  return true;
}

let canalOk = false;
function ligaTempoReal() {
  if (canalOk) return;
  canalOk = true;
  cli.channel('mudancas')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'progresso' }, pl => {
      const r = pl.new && pl.new.conta ? pl.new : pl.old;
      if (!r) return;
      if (pl.eventType === 'DELETE') {
        if (PROG[r.conta]) delete PROG[r.conta][r.handle];
      } else {
        if (!PROG[r.conta]) PROG[r.conta] = {};
        PROG[r.conta][r.handle] = { estado: pl.new.estado, ts: Date.parse(pl.new.ts) || Date.now() };
      }
      route();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'celulares' }, async () => { await recarregaConfig(); route(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'contas' }, async () => { await recarregaConfig(); route(); })
    .subscribe();
}
async function recarregaConfig() {
  const [cels, cts] = await Promise.all([
    cli.from('celulares').select('*').order('ordem'),
    cli.from('contas').select('*').order('ordem'),
  ]);
  if (!cels.error) CELULARES = cels.data;
  if (!cts.error) CONTAS = cts.data;
}
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && carregado) { await carregaTudo(); route(); }
});

    '<button class="btn primary" id="lgBtn" style="width:100%;">Entrar</button>' +
    (msg ? '<p class="erro">' + esc(msg) + '</p>' : '') +
    '<p class="note">Dica: fixe essa p&aacute;gina na tela inicial do iPhone (Compartilhar &rarr; Adicionar &agrave; Tela de In&iacute;cio).</p>' +
    '</div>';
  const entra = async () => {
    const email = document.getElementById('lgEmail').value.trim();
    const senha = document.getElementById('lgSenha').value;
    if (!email || !senha) { renderLogin('Preencha email e senha.'); return; }
    document.getElementById('lgBtn').textContent = 'Entrando…';
    const { error } = await cli.auth.signInWithPassword({ email, password: senha });
    if (error) renderLogin('Email ou senha incorretos.');
  };
  document.getElementById('lgBtn').addEventListener('click', entra);
  document.getElementById('lgSenha').addEventListener('keydown', e => { if (e.key === 'Enter') entra(); });
}

// ---------- painel ----------
function opsAbertos() { const v = lsGet('cf_goab', []); return Array.isArray(v) ? v : []; }

function renderPainel() {
  syncChip();
  const gestor = EU.papel === 'gestor';
  let listaOps;
  if (gestor) {
    listaOps = OPERADORES.slice().sort((a, b) => {
      if (a.email === EU.email) return -1;
      if (b.email === EU.email) return 1;
      return a.nome.localeCompare(b.nome);
    });
  } else {
    listaOps = [OPERADORES.find(o => o.email === EU.email)].filter(Boolean);
  }

  let h = '<div class="eyebrow">Painel de ' + esc(EU.nome) + (gestor ? ' &middot; gestor' : '') + '</div>';
  h += '<h1>Celulares e contas</h1>';
  h += '<p class="sub">' + (gestor ? 'Toque no nome de um operador pra abrir os celulares dele.' : 'Toque numa conta pra abrir o checklist da regi&atilde;o dela.') + '</p>';

  const celCard = (cel) => {
    const reg = PERFIS[cel.regiao] ? PERFIS[cel.regiao].nome : cel.regiao;
    const dono = cel.operador_email === EU.email;
    let c = '<div class="card"><div class="cel-head"><h2>' + esc(cel.nome) + '</h2>';
    if (gestor) {
      c += '<span class="g-row"><button class="minibtn" data-ddc="' + esc(cel.id) + '">Dados</button>' +
        '<label>regi&atilde;o</label><select class="sel" data-gcel="' + esc(cel.id) + '" data-campo="regiao">' +
        Object.keys(PERFIS).map(s => '<option value="' + esc(s) + '"' + (s === cel.regiao ? ' selected' : '') + '>' + esc(PERFIS[s].nome) + '</option>').join('') +
        '</select>' +
        '<label>operador</label><select class="sel" data-gcel="' + esc(cel.id) + '" data-campo="operador_email">' +
        OPERADORES.map(o => '<option value="' + esc(o.email) + '"' + (o.email === cel.operador_email ? ' selected' : '') + '>' + esc(o.nome) + '</option>').join('') +
        '</select></span>';
    } else {
      c += '<span class="g-row">' + (dono ? '<button class="minibtn" data-ddc="' + esc(cel.id) + '">Dados</button>' : '') +
        '<span class="cel-region">' + esc(reg) + '</span></span>';
    }
    c += '</div>';
    const podeStatus = gestor || cel.operador_email === EU.email;
    for (const conta of contasDoCel(cel.id)) {
      const r = resumoConta(conta.id);
      const at = atuais(conta.id);
      const st = conta.status || 'ativa';
      const stSel = podeStatus
        ? '<span style="margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0;">' +
          '<button class="minibtn" data-dd="' + esc(conta.id) + '">Dados</button>' +
          '<select class="st-sel ' + st + '" data-gst="' + esc(conta.id) + '" style="margin-left:0;">' +
          [['ativa','Ativa'],['pausada','Pausada'],['ban','Ban']].map(([v, l]) => '<option class="' + v + '" value="' + v + '"' + (st === v ? ' selected' : '') + '>' + l + '</option>').join('') +
          '</select></span>'
        : '';
      c += '<div class="conta-row ' + st + '" data-conta="' + esc(conta.id) + '">' +
        '<div class="conta-main"><div class="conta-user" style="display:flex;align-items:center;gap:2px;"><span class="dot ' + st + '" title="' + st + '"></span>' + esc(conta.usuario) + stSel + '</div>' +
        '<div class="conta-meta">Bloco ' + BLOCOS[r.sl.idx] + ' &middot; ' + r.feitos + '/' + r.total + ' conclu&iacute;dos' + (r.nDesc ? ' &middot; ' + r.nDesc + ' descartados' : '') + '</div>' +
        (at.length ? '<div class="conta-atual">&#9679; seguindo agora: ' + at.map(esc).join(', ') + '</div>' : '') +
        '<div class="pbar"><div style="width:' + r.pct + '%"></div></div></div>' +
        '<span class="pct">' + r.pct + '%</span><span class="arrow">&rarr;</span></div>';
    }
    c += '</div>';
    return c;
  };

  const abertos = opsAbertos();
  for (const op of listaOps) {
    const cels = celsDe(op.email);
    const nContas = cels.reduce((n, cel) => n + contasDoCel(cel.id).length, 0);
    if (gestor) {
      const aberto = abertos.includes(op.email);
      h += '<div class="op-head' + (aberto ? '' : ' fechado') + '" data-oph="' + esc(op.email) + '">' +
        '<span class="nome">' + esc(op.nome) + (op.email === EU.email ? ' (voc&ecirc;)' : '') + '</span>' +
        '<small>' + (cels.length ? cels.length + ' celulares &middot; ' + nContas + ' contas' : 'sem celulares ainda') + '</small>' +
        '<span class="caret">&#9662;</span></div>';
      h += '<div class="op-body" data-opb="' + esc(op.email) + '"' + (aberto ? '' : ' hidden') + '>';
      if (!cels.length) h += '<div class="card">Nenhum celular atribu&iacute;do. Use o seletor "operador" de um celular pra trazer pra c&aacute;.</div>';
      for (const cel of cels) h += celCard(cel);
      h += '</div>';
    } else {
      if (!cels.length) h += '<div class="card">Nenhum celular atribu&iacute;do a voc&ecirc; ainda. Fale com o Lucas.</div>';
      for (const cel of cels) h += celCard(cel);
    }
  }

  h += '<button class="btn" id="btnRel" style="width:100%;margin-top:6px;">Copiar relat&oacute;rio</button>';
  h += '<p class="note">Regi&otilde;es mapeadas sem celular: ' +
    Object.keys(PERFIS).filter(s => !CELULARES.some(c => c.regiao === s)).map(s => esc(PERFIS[s].nome)).join(' &middot; ') + '.</p>';
  app.innerHTML = h;

  app.querySelectorAll('.op-head').forEach(hd => hd.addEventListener('click', () => {
    const email = hd.dataset.oph;
    const ab = opsAbertos();
    const i = ab.indexOf(email);
    if (i >= 0) ab.splice(i, 1); else ab.push(email);
    lsSet('cf_goab', ab);
    const body = app.querySelector('.op-body[data-opb="' + CSS.escape(email) + '"]');
    if (body) body.hidden = !body.hidden;
    hd.classList.toggle('fechado');
  }));
  app.querySelectorAll('[data-dd]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); abreDadosConta(b.dataset.dd); }));
  app.querySelectorAll('[data-ddc]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); abreDadosCel(b.dataset.ddc); }));
  app.querySelectorAll('.st-sel').forEach(s => {
    s.addEventListener('click', e => e.stopPropagation());
    s.addEventListener('change', async e => {
      e.stopPropagation();
      const { error } = await cli.from('contas').update({ status: s.value }).eq('id', s.dataset.gst);
      if (error) toast('Falha ao salvar o status.');
      else { await recarregaConfig(); toast('Status salvo.'); route(); }
    });
  });
  app.querySelectorAll('.conta-row').forEach(r => r.addEventListener('click', () => nav('#c/' + encodeURIComponent(r.dataset.conta))));
  document.getElementById('btnRel').addEventListener('click', copiaRelatorio);
  app.querySelectorAll('select[data-gcel]').forEach(s => s.addEventListener('change', async () => {
    const upd = {}; upd[s.dataset.campo] = s.value;
    const { error } = await cli.from('celulares').update(upd).eq('id', s.dataset.gcel);
    if (error) { toast('Falha ao salvar atribuição.'); }
    else { await recarregaConfig(); toast('Atribuição salva.'); route(); }
  }));
  window.scrollTo(0, 0);
}

// ---------- tela da conta ----------
let filtroStatus = 'todos';
let busca = '';

function renderConta(contaId) {
  syncChip();
  const conta = CONTAS.find(c => c.id === contaId);
  const cel = celDe(conta);
  const reg = PERFIS[cel.regiao] ? PERFIS[cel.regiao].nome : cel.regiao;
  const r = resumoConta(contaId);

  const st = conta.status || 'ativa';
  let h = '<button class="back" id="btnBack">&larr; voltar pro painel</button>';
  h += '<div class="eyebrow">' + esc(cel.nome) + ' &middot; ' + esc(reg) + '</div>';
  h += '<h1 style="display:flex;align-items:center;"><span class="dot ' + st + '"></span>' + esc(conta.usuario) +
    (st !== 'ativa' ? '<span class="pill off" style="margin-left:10px;">' + st + '</span>' : '') + '</h1>';
  h += '<p class="sub">Bloco ' + BLOCOS[r.sl.idx] + ' de ' + r.sl.total + ' &middot; ' + r.sl.grupos.length + ' faculdades &middot; ' + r.sl.perfis.length + ' perfis-alvo (particulares primeiro)</p>';
  h += '<div id="banner"></div>';
  h += '<div class="foco"><b>Como operar:</b> ' + esc(conta.foco || FOCO_PADRAO) +
    (EU.papel === 'gestor' ? ' <button class="minibtn" id="editFoco" style="margin-left:6px;">editar</button>' : '') + '</div>';
  h += '<div class="statbar">' +
    '<div class="stat"><div class="n" id="stN">&ndash;</div><div class="l">Conclu&iacute;dos</div></div>' +
    '<div class="stat"><div class="n" id="stA">&ndash;</div><div class="l">Em andamento</div></div>' +
    '<div class="stat"><div class="n" id="stP">&ndash;</div><div class="l">Progresso</div></div></div>';
  h += '<div class="tools"><input class="search" id="busca" type="search" placeholder="Buscar @, faculdade..." value="' + esc(busca) + '">' +
    '<button class="btn primary" id="btnRetomar">Retomar</button></div>';
  h += '<select class="idx" id="idxFac"><option value="">Ir para faculdade&hellip;</option>' +
    r.sl.grupos.map(g => '<option value="' + esc(g.f) + '">' + esc(g.f) + ' (' + g.perfis.length + ')</option>').join('') + '</select>';
  h += '<div class="chips">' + [['todos','Todos'],['pend','Pendentes'],['done','Conclu&iacute;dos'],['desc','Descartados' + (r.nDesc ? ' (' + r.nDesc + ')' : '')]]
    .map(([k, l]) => '<button class="chip' + (filtroStatus === k ? ' on' : '') + '" data-fs="' + k + '">' + l + '</button>').join('') + '</div>';
  h += '<div class="card" id="lista"></div>';
  app.innerHTML = h;

  document.getElementById('btnBack').addEventListener('click', () => { busca = ''; filtroStatus = 'todos'; nav('#painel'); });
  document.getElementById('busca').addEventListener('input', e => { busca = e.target.value; desenhaLista(contaId); });
  document.getElementById('btnRetomar').addEventListener('click', () => {
    const at = atuais(contaId);
    if (at.length) { expandEScroll(contaId, at[0]); return; }
    const prox = sliceDe(conta).perfis.find(p => !estadoDe(contaId, p.h));
    if (prox) expandEScroll(contaId, prox.h);
    else toast('Tudo resolvido nessa conta.');
  });
  document.getElementById('idxFac').addEventListener('change', e => {
    const f = e.target.value;
    if (!f) return;
    if (abreGrp(contaId, f)) desenhaLista(contaId);
    setTimeout(() => {
      const head = document.querySelector('#lista .fac-head[data-g="' + CSS.escape(f) + '"]');
      if (head) head.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 60);
    e.target.value = '';
  });
  app.querySelectorAll('.chip[data-fs]').forEach(c => c.addEventListener('click', () => { filtroStatus = c.dataset.fs; renderConta(contaId); }));
  const ef = document.getElementById('editFoco');
  if (ef) ef.addEventListener('click', async () => {
    const novo = prompt('Instrução de foco dessa conta:', conta.foco || FOCO_PADRAO);
    if (novo === null) return;
    const { error } = await cli.from('contas').update({ foco: novo || null }).eq('id', contaId);
    if (error) toast('Falha ao salvar o foco.');
    else { await recarregaConfig(); toast('Foco salvo.'); renderConta(contaId); }
  });
  desenhaBanner(contaId);
  desenhaLista(contaId);
  renderContaStats(contaId);
  window.scrollTo(0, 0);
}

function expandEScroll(contaId, handle) {
  const sl = sliceDe(CONTAS.find(c => c.id === contaId));
  const p = sl.perfis.find(x => x.h === handle);
  if (p && abreGrp(contaId, p.f || 'Sem faculdade')) desenhaLista(contaId);
  setTimeout(() => {
    const row = document.querySelector('#lista .perfil[data-ph="' + CSS.escape(handle) + '"]');
    if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    else toast('Esse perfil não aparece no filtro ativo.');
  }, 60);
}

function desenhaBanner(contaId) {
  const el = document.getElementById('banner');
  if (!el) return;
  const at = atuais(contaId);
  if (!at.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="atual-banner"><span class="tag">Seguindo agora (' + at.length + ')</span>' +
    at.map(h => '<div class="atual-item"><span class="h">' + esc(h) + '</span>' +
      '<button class="btn" data-ir="' + esc(h) + '">Ver</button>' +
      '<button class="btn primary" data-fimb="' + esc(h) + '">Conclu&iacute;do</button></div>').join('') +
    '</div>';
  el.querySelectorAll('[data-ir]').forEach(b => b.addEventListener('click', () => expandEScroll(contaId, b.dataset.ir)));
  el.querySelectorAll('[data-fimb]').forEach(b => b.addEventListener('click', () => concluiAtual(contaId, b.dataset.fimb)));
}

function concluiAtual(contaId, handle) {
  setProg(contaId, handle, 'concluido');
  toast(handle + ' concluído.');
  desenhaBanner(contaId);
  desenhaLista(contaId);
  renderContaStats(contaId);
}

function desenhaLista(contaId) {
  const conta = CONTAS.find(c => c.id === contaId);
  const sl = sliceDe(conta);
  const p = PROG[contaId] || {};
  const fechados = grpFechados(contaId);
  const q = busca.trim().toLowerCase();
  const buscando = q.length > 0;
  const est = h => (p[h] ? p[h].estado : null);
  const itens = sl.perfis.filter(x => {
    const e = est(x.h);
    if (filtroStatus === 'pend' && e) return false;
    if (filtroStatus === 'done' && e !== 'concluido') return false;
    if (filtroStatus === 'desc' && e !== 'descartado') return false;
    if (q && !(x.h.toLowerCase().includes(q) || (x.f || '').toLowerCase().includes(q) || (x.t || '').toLowerCase().includes(q))) return false;
    return true;
  });
  const el = document.getElementById('lista');
  if (!itens.length) { el.innerHTML = '<p class="note" style="padding:10px 0;">Nenhum perfil nesse filtro.</p>'; return; }

  let html = '';
  let facAtualNome = null;
  for (const x of itens) {
    const fac = x.f || 'Sem faculdade';
    if (fac !== facAtualNome) {
      if (facAtualNome !== null) html += '</div>';
      facAtualNome = fac;
      const aberto = buscando || !fechados.includes(fac);
      const doGrupo = itens.filter(y => (y.f || 'Sem faculdade') === fac);
      const feitosGrupo = doGrupo.filter(y => est(y.h) === 'concluido').length;
      const descGrupo = doGrupo.filter(y => est(y.h) === 'descartado').length;
      html += '<div class="fac-head' + (aberto ? '' : ' fechado') + '" data-g="' + esc(fac) + '">' + esc(fac) +
        '<span class="fac-badge' + (x.pr ? ' part' : '') + '">' + (x.pr ? 'PARTICULAR' : 'P&Uacute;BLICA') + '</span>' +
        '<span class="caret">&#9662;</span>' +
        '<small>' + feitosGrupo + '/' + (doGrupo.length - descGrupo) + ' conclu&iacute;dos' + (descGrupo ? ' &middot; ' + descGrupo + ' desc.' : '') + '</small></div>';
      html += '<div class="grp" data-gc="' + esc(fac) + '"' + (aberto ? '' : ' hidden') + '>';
    }
    const e = est(x.h);
    const done = e === 'concluido';
    const disc = e === 'descartado';
    const isAt = e === 'seguindo';
    const seg = x.s ? x.s.toLocaleString('pt-BR') + ' seg.' : 'seg. n/d';
    let alerta = '';
    if (x.d) alerta += ' &middot; <span class="warn">&#9888; duvidoso</span>';
    if (x.i) alerta += ' &middot; <span class="warn">&#9888; inativo?</span>';
    let acts = '';
    if (disc) acts = '<div class="acts"><button class="minibtn" data-rest="' + esc(x.h) + '">Restaurar</button></div>';
    else if (isAt) acts = '<div class="acts"><button class="minibtn fim" data-fim="' + esc(x.h) + '">Conclu&iacute;do</button></div>';
    else if (!done) acts = '<div class="acts"><button class="minibtn go" data-go="' + esc(x.h) + '">Come&ccedil;ar</button>' +
      '<button class="minibtn" data-desc="' + esc(x.h) + '" title="Perfil morto ou privado">Descartar</button></div>';
    const chk = (isAt || done)
      ? '<input type="checkbox" data-h="' + esc(x.h) + '"' + (done ? ' checked' : '') + ' title="Marcar concluído">'
      : '<span class="chk-vazio"></span>';
    html += '<div class="perfil' + (done ? ' done' : '') + (disc ? ' desc' : '') + (isAt ? ' atual' : '') + '" data-ph="' + esc(x.h) + '">' +
      chk +
      '<span class="info"><a href="https://www.instagram.com/' + esc(x.h.slice(1)) + '/" target="_blank" rel="noopener">' + esc(x.h) + '</a>' +
      (isAt ? '<span class="pill">seguindo agora</span>' : '') +
      (disc ? '<span class="pill off">descartado</span>' : '') +
      '<div class="meta">' + esc(x.t) + ' &middot; ' + seg + alerta + '</div></span>' +
      acts + '</div>';
  }
  if (facAtualNome !== null) html += '</div>';
  el.innerHTML = html;

  el.querySelectorAll('.fac-head').forEach(hd => hd.addEventListener('click', () => {
    toggleGrp(contaId, hd.dataset.g);
    const grp = el.querySelector('.grp[data-gc="' + CSS.escape(hd.dataset.g) + '"]');
    if (grp) grp.hidden = !grp.hidden;
    hd.classList.toggle('fechado');
  }));
  const redesenha = () => { desenhaBanner(contaId); desenhaLista(contaId); renderContaStats(contaId); };
  el.querySelectorAll('input[type=checkbox]').forEach(cb => cb.addEventListener('change', () => {
    setProg(contaId, cb.dataset.h, cb.checked ? 'concluido' : null);
    redesenha();
  }));
  el.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    setProg(contaId, b.dataset.go, 'seguindo');
    toast('Seguindo agora: ' + b.dataset.go);
    redesenha();
  }));
  el.querySelectorAll('[data-fim]').forEach(b => b.addEventListener('click', () => concluiAtual(contaId, b.dataset.fim)));
  el.querySelectorAll('[data-desc]').forEach(b => b.addEventListener('click', () => {
    setProg(contaId, b.dataset.desc, 'descartado');
    toast(b.dataset.desc + ' descartado.');
    renderConta(contaId);
  }));
  el.querySelectorAll('[data-rest]').forEach(b => b.addEventListener('click', () => {
    setProg(contaId, b.dataset.rest, null);
    toast(b.dataset.rest + ' de volta na lista.');
    renderConta(contaId);
  }));
}

function renderContaStats(contaId) {
  const r = resumoConta(contaId);
  const n = document.getElementById('stN'), aa = document.getElementById('stA'), pp = document.getElementById('stP');
  if (n) { n.textContent = r.feitos + '/' + r.total; aa.textContent = r.nAt; pp.textContent = r.pct + '%'; }
}

function copiaRelatorio() {
  const gestor = EU.papel === 'gestor';
  const ops = gestor ? OPERADORES : [OPERADORES.find(o => o.email === EU.email)].filter(Boolean);
  let txt = 'Relatorio de follow · ' + hojeStr(Date.now()) + '\n';
  for (const op of ops) {
    const cels = celsDe(op.email);
    if (!cels.length) continue;
    txt += '\n== ' + op.nome + ' ==\n';
    for (const cel of cels) {
      txt += cel.nome + ' · ' + (PERFIS[cel.regiao] ? PERFIS[cel.regiao].nome : cel.regiao) + '\n';
      for (const conta of contasDoCel(cel.id)) {
        const r = resumoConta(conta.id);
        const at = atuais(conta.id);
        txt += conta.usuario + ': ' + r.feitos + '/' + r.total + ' concluidos' +
          (r.nDesc ? ' · ' + r.nDesc + ' descartados' : '') +
          (at.length ? ' · seguindo agora ' + at.join(', ') : '') + '\n';
      }
    }
  }
  navigator.clipboard.writeText(txt).then(
    () => toast('Relatório copiado. Cola no WhatsApp.'),
    () => toast('Não deu pra copiar automaticamente.')
  );
}

// ---------- popup de dados (credenciais ficam SÓ no banco, nunca no código) ----------
function fechaModal() { const m = document.getElementById('modalBg'); if (m) m.remove(); }
function abreModal(html) {
  fechaModal();
  const d = document.createElement('div');
  d.className = 'modal-bg';
  d.id = 'modalBg';
  d.innerHTML = '<div class="modal">' + html + '</div>';
  d.addEventListener('click', e => { if (e.target === d) fechaModal(); });
  document.body.appendChild(d);
  d.querySelectorAll('[data-cp]').forEach(b => b.addEventListener('click', () => {
    const inp = document.getElementById(b.dataset.cp);
    if (inp && inp.value) navigator.clipboard.writeText(inp.value).then(() => toast('Copiado.'), () => toast('Não deu pra copiar.'));
    else toast('Campo vazio.');
  }));
  const fx = d.querySelector('#ddFechar');
  if (fx) fx.addEventListener('click', fechaModal);
}
function campoDado(id, label, valor, edit) {
  return '<div class="dado"><label>' + label + '</label><div class="linha">' +
    '<input id="' + id + '" value="' + esc(valor || '') + '"' + (edit ? '' : ' readonly') + ' autocomplete="off">' +
    '<button class="btn" data-cp="' + id + '">Copiar</button></div></div>';
}
function abreDadosConta(contaId) {
  const conta = CONTAS.find(c => c.id === contaId);
  const cel = celDe(conta);
  const edit = EU.papel === 'gestor' || cel.operador_email === EU.email;
  abreModal('<h2>' + esc(conta.usuario) + '</h2><div class="mm">' + esc(cel.nome) + ' &middot; dados da conta</div>' +
    campoDado('ddA', 'Email da conta', conta.email, edit) +
    campoDado('ddB', 'Senha do Instagram', conta.senha_ig, edit) +
    campoDado('ddC', 'Senha do email', conta.senha_email, edit) +
    campoDado('ddD', 'Observa&ccedil;&otilde;es', conta.obs, edit) +
    '<div class="rodape">' + (edit ? '<button class="btn primary" id="ddSalvar">Salvar</button>' : '') +
    '<button class="btn" id="ddFechar">Fechar</button></div>');
  const sv = document.getElementById('ddSalvar');
  if (sv) sv.addEventListener('click', async () => {
    const upd = {
      email: document.getElementById('ddA').value.trim() || null,
      senha_ig: document.getElementById('ddB').value.trim() || null,
      senha_email: document.getElementById('ddC').value.trim() || null,
      obs: document.getElementById('ddD').value.trim() || null,
    };
    const { error } = await cli.from('contas').update(upd).eq('id', contaId);
    if (error) toast('Falha ao salvar: ' + error.message);
    else { await recarregaConfig(); toast('Dados salvos.'); fechaModal(); }
  });
}
function abreDadosCel(celId) {
  const cel = CELULARES.find(c => c.id === celId);
  const edit = EU.papel === 'gestor';
  const ehIphone = !!(cel.apple_email || /iphone/i.test(cel.nome));

  if (ehIphone) {
    abreModal('<h2>' + esc(cel.nome) + '</h2><div class="mm">Apple ID do aparelho</div>' +
      campoDado('ddA', 'Email do Apple ID', cel.apple_email, edit) +
      campoDado('ddB', 'Senha do Apple ID', cel.apple_senha, edit) +
      '<div class="rodape">' + (edit ? '<button class="btn primary" id="ddSalvar">Salvar</button>' : '') +
      '<button class="btn" id="ddFechar">Fechar</button></div>');
    const sv = document.getElementById('ddSalvar');
    if (sv) sv.addEventListener('click', async () => {
      const upd = {
        apple_email: document.getElementById('ddA').value.trim() || null,
        apple_senha: document.getElementById('ddB').value.trim() || null,
      };
      const { error } = await cli.from('celulares').update(upd).eq('id', celId);
      if (error) toast('Falha ao salvar: ' + error.message);
      else { await recarregaConfig(); toast('Dados salvos.'); fechaModal(); }
    });
    return;
  }

  // Android: lista de emails do aparelho (formato no banco: "email ; senha", um por linha)
  const linhas = String(cel.emails || '').split('\n').map(l => l.trim()).filter(Boolean);
  let corpo = '';
  if (!linhas.length) corpo = '<p class="note">Nenhum email cadastrado neste aparelho ainda.</p>';
  linhas.forEach((l, i) => {
    const partes = l.split(/[;|]/).map(x => x.trim());
    corpo += campoDado('ddE' + i, 'Email ' + (i + 1), partes[0] || '', false);
    if (partes[1]) corpo += campoDado('ddS' + i, 'Senha do email ' + (i + 1), partes[1], false);
  });
  if (edit) {
    corpo += '<div class="dado"><label>Editar lista (um por linha: email ; senha)</label>' +
      '<textarea class="bk-area" id="ddEmails" style="min-height:90px;">' + esc(cel.emails || '') + '</textarea></div>';
  }
  abreModal('<h2>' + esc(cel.nome) + '</h2><div class="mm">Emails do aparelho</div>' + corpo +
    '<div class="rodape">' + (edit ? '<button class="btn primary" id="ddSalvar">Salvar</button>' : '') +
    '<button class="btn" id="ddFechar">Fechar</button></div>');
  const sv = document.getElementById('ddSalvar');
  if (sv) sv.addEventListener('click', async () => {
    const { error } = await cli.from('celulares').update({ emails: document.getElementById('ddEmails').value.trim() || null }).eq('id', celId);
    if (error) toast('Falha ao salvar: ' + error.message);
    else { await recarregaConfig(); toast('Dados salvos.'); fechaModal(); }
  });
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------- inicialização ----------
// IMPORTANTE: nunca chamar o banco DENTRO do onAuthStateChange — o supabase-js
// segura um lock interno durante o callback e as consultas travam pra sempre.
let bootando = false;
async function boot(sessao) {
  if (carregado || bootando) return;
  bootando = true;
  const email = sessao.user.email;
  app.innerHTML = '<p class="note" style="text-align:center;padding-top:40px;">Carregando dados&hellip;</p>';
  const ok = await carregaTudo();
  if (!ok) {
    bootando = false;
    app.innerHTML = '<div class="card" style="margin-top:32px;">N&atilde;o consegui carregar os dados.</div>' +
      '<button class="btn primary" id="tentaBtn">Tentar de novo</button> <button class="btn" id="saiBtn">Sair</button>';
    document.getElementById('tentaBtn').addEventListener('click', () => boot(sessao));
    document.getElementById('saiBtn').addEventListener('click', () => cli.auth.signOut());
    return;
  }
  EU = OPERADORES.find(o => o.email === email) || null;
  if (!EU) {
    bootando = false;
    app.innerHTML = '<div class="card" style="margin-top:32px;">Seu login (' + esc(email) + ') ainda n&atilde;o tem perfil na opera&ccedil;&atilde;o. Fale com o Lucas.</div>' +
      '<button class="btn" id="saiBtn">Sair</button>';
    document.getElementById('saiBtn').addEventListener('click', () => cli.auth.signOut());
    return;
  }
  carregado = true;
  bootando = false;
  syncChip();
  ligaTempoReal();
  if (!location.hash) { try { history.replaceState(null, '', '#painel'); } catch (e) {} }
  route();
}

cli.auth.onAuthStateChange((evento, sessao) => {
  if (evento === 'SIGNED_OUT' || !sessao) {
    carregado = false; bootando = false; EU = null;
    renderLogin();
    return;
  }
  // agenda pra FORA do callback (evita o deadlock do lock de auth)
  setTimeout(() => boot(sessao), 0);
});

(async () => {
  const { data } = await cli.auth.getSession();
  if (data && data.session) boot(data.session); else renderLogin();
})();
</script>
